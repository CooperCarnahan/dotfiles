# Pre-commit hooks for the chezmoi dotfiles repo.
# Compatible with `prek` (drop-in replacement: https://github.com/j178/prek).
#
# Install once per clone:
#     prek install     # or: pre-commit install
#
# Manually run on the whole repo:
#     prek run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.patch$'
      - id: end-of-file-fixer
      - id: check-yaml
        # Skip files chezmoi will template — they contain non-YAML {{ }} blocks
        # that some parsers can't handle.
        exclude: '\.tmpl$'
      - id: check-json
        # Native modify templates keep the target's .json suffix so chezmoi maps
        # them correctly, but their source is Go-template code rather than JSON.
        # The Claude desired object is also templated before it becomes JSON.
        exclude: '(\.tmpl$|^\.chezmoitemplates/claude-settings\.json$|(^|/)modify_[^/]+\.json$)'
      - id: check-toml
        exclude: '\.tmpl$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        # Overrides the hook's default `--default-schema-catalogs`. taplo 0.9.3
        # only accepts a Schema Store catalog whose `$schema` is exactly
        # `https://json.schemastore.org/schema-catalog.json`; the store now
        # serves `https://www.schemastore.org/schema-catalog.json`, so the
        # catalog fails to deserialize and lint always exits 1. Syntax/rule
        # linting still runs — only online schema validation is off.
        args: [--no-schema]

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.4.1
    hooks:
      - id: stylua

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # Templated shell scripts have chezmoi template directives that
        # shellcheck can't parse; skip them.
        exclude: '\.tmpl$'

  - repo: local
    hooks:
      - id: chezmoi-template-indent
        name: no indented bare-delimiter control flow in chezmoi templates
        description: >
          An indented {{ if }}/{{ else }}/{{ end }} whose left delimiter lacks
          the trim marker emits its leading whitespace as literal output.
          Indent only actions written {{- ... }}.
        language: system
        files: '(\.tmpl$|^\.chezmoiremove$|^\.chezmoiignore$|^\.chezmoitemplates/)'
        exclude: '(windows|glzr)'
        entry: >
          bash -c 'if grep -nE "^[[:space:]]+\{\{[[:space:]]*(if|else|end|range|with|template|define|block)\b" "$@" /dev/null;
          then echo "indented bare-delimiter control flow -- use {{- instead"; exit 1; fi' --
